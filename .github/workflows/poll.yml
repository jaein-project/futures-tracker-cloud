name: "진폭 통합 폴링"

on:
  schedule:
    - cron: "*/5 * * * *"   # 5분마다 - 놓친 체크포인트/경제발표가 있으면 그때그때 채움
  workflow_dispatch:

# 2026-09-02 추가: GitHub 기본 5분 스케줄과 cron-job.org의 외부 workflow_dispatch(15분마다)가
# 겹치는 시간대에 동시 실행되면, 둘 다 "아직 기록 안 됐다"는 같은 시트 상태를 보고
# 같은 체크포인트를 중복으로 기록하는 버그가 있었음(8/31 09:00/10:30 중복 행).
# 동시 실행을 막아서 항상 한 번에 하나씩만 돌게 함 (겹치면 새 실행이 이전 실행 끝날 때까지 대기).
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "패키지 설치"
        run: pip install -r requirements-cloud.txt

      - name: "구글 인증 토큰 복원"
        run: echo "${{ secrets.GOOGLE_TOKEN_B64 }}" | base64 -d > token.pickle

      - name: "체크포인트 + 경제발표 확인"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL_ECONOMIC: ${{ secrets.SLACK_WEBHOOK_URL_ECONOMIC }}
          SLACK_WEBHOOK_URL_TRACKER: ${{ secrets.SLACK_WEBHOOK_URL_TRACKER }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python gh_actions_poll.py
