name: "진폭 통합 폴링"

on:
  schedule:
    - cron: "*/5 * * * *"   # 5분마다 - 놓친 체크포인트/경제발표가 있으면 그때그때 채움
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "패키지 설치"
        run: pip install -r requirements-cloud.txt

      - name: "구글 인증 토큰 복원"
        run: echo "${{ secrets.GOOGLE_TOKEN_B64 }}" | base64 -d > token.pickle

      - name: "체크포인트 + 경제발표 확인"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL_ECONOMIC: ${{ secrets.SLACK_WEBHOOK_URL_ECONOMIC }}
          SLACK_WEBHOOK_URL_TRACKER: ${{ secrets.SLACK_WEBHOOK_URL_TRACKER }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python gh_actions_poll.py
