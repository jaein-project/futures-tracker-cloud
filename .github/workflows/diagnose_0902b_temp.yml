name: TEMP 0902 천연가스-엔화 역검증

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 패키지 설치
        run: pip install -r requirements-cloud.txt
      - name: 천연가스-엔화 진폭 역계산
        run: python verify_0902_temp.py
