name: "임시 진단 - 천연가스 이력데이터 재계산 (NGV26 기준)"

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: "패키지 설치"
        run: pip install requests pytz

      - name: "천연가스 이력 재계산 실행"
        run: |
          python - <<'PY'
          import requests
          from datetime import datetime
          import pytz

          KST = pytz.timezone("Asia/Seoul")
          HEADERS = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"}

          def get_intraday_high_low(symbol, day_start_kst, target_dt_kst):
              period1 = int(day_start_kst.astimezone(pytz.UTC).timestamp())
              period2 = int(target_dt_kst.astimezone(pytz.UTC).timestamp()) + 60
              url = f"https://query1.finance.yahoo.com/v8/finance/chart/{symbol}"
              params = {"period1": period1, "period2": period2, "interval": "5m"}
              res = requests.get(url, headers=HEADERS, params=params, timeout=10)
              data = res.json()
              result = data["chart"]["result"][0]
              timestamps = result.get("timestamp")
              if not timestamps:
                  return None
              quote = result["indicators"]["quote"][0]
              highs, lows = [], []
              for i, ts in enumerate(timestamps):
                  if ts is None:
                      continue
                  bar_time_kst = datetime.fromtimestamp(ts, tz=pytz.UTC).astimezone(KST)
                  if day_start_kst <= bar_time_kst <= target_dt_kst:
                      h, l = quote["high"][i], quote["low"][i]
                      if h is not None:
                          highs.append(h)
                      if l is not None:
                          lows.append(l)
              if not highs or not lows:
                  return None
              return {"high": round(float(max(highs)), 5), "low": round(float(min(lows)), 5)}

          def calc_ticks(high, low):
              return round((high - low) / 0.001)

          rows = [
              ("221", "2026-08-21", "2026-08-21 15:20", 61),
              ("222", "2026-08-21", "2026-08-21 15:55", 61),
              ("223", "2026-08-21", "2026-08-21 22:25", 87),
              ("224", "2026-08-21", "2026-08-22 05:05", 87),
              ("225", "2026-08-24", "2026-08-24 15:20", 22),
              ("226", "2026-08-24", "2026-08-24 15:55", 26),
              ("227", "2026-08-24", "2026-08-24 22:25", 123),
              ("228", "2026-08-24", "2026-08-25 05:05", 123),
              ("229", "2026-08-25", "2026-08-25 15:20", 73),
              ("230", "2026-08-25", "2026-08-25 15:55", 74),
              ("231", "2026-08-25", "2026-08-25 22:25", 104),
              ("232", "2026-08-25", "2026-08-26 05:05", 108),
              ("233", "2026-08-26", "2026-08-26 15:20", 99),
              ("234", "2026-08-26", "2026-08-26 15:55", 99),
              ("235", "2026-08-26", "2026-08-26 21:25", 135),
              ("236", "2026-08-26", "2026-08-26 21:35", 135),
              ("237", "2026-08-26", "2026-08-26 22:25", 135),
          ]

          print(f"{'행':>4s} {'day_start':10s} {'target':16s} {'구값NGU26':>9s} {'신값NGV26':>9s} {'차이':>6s}")
          for row_num, ds, tgt, old_val in rows:
              day_start = KST.localize(datetime.strptime(ds, "%Y-%m-%d"))
              target_dt = KST.localize(datetime.strptime(tgt, "%Y-%m-%d %H:%M"))
              hl = get_intraday_high_low("NGV26.NYM", day_start, target_dt)
              if hl:
                  new_val = calc_ticks(hl["high"], hl["low"])
                  diff = new_val - old_val
                  print(f"{row_num:>4s} {ds:10s} {tgt:16s} {old_val:>9d} {new_val:>9d} {diff:>+6d}   (고:{hl['high']} 저:{hl['low']})")
              else:
                  print(f"{row_num:>4s} {ds:10s} {tgt:16s} {old_val:>9d} 데이터없음")
          PY
