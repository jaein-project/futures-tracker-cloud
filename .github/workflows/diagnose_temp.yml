name: "임시 진단 - 구리 데이터 확인"
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "패키지 설치"
        run: pip install requests pytz
      - name: "구리 체크포인트별 누적 틱 확인"
        run: |
          python3 << 'PYEOF'
          import requests, pytz
          from datetime import datetime, timedelta

          KST = pytz.timezone("Asia/Seoul")
          HEADERS = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"}

          now = datetime.now(KST)
          today = now.date()
          day_start = KST.localize(datetime(today.year, today.month, today.day, 7, 0))

          checkpoints = {
              "아시아장중(12:00)": KST.localize(datetime(today.year, today.month, today.day, 12, 0)),
              "아시아마감전(15:20)": KST.localize(datetime(today.year, today.month, today.day, 15, 20)),
              "유럽개장전(15:55)": KST.localize(datetime(today.year, today.month, today.day, 15, 55)),
              "현재(진단시점)": now,
          }

          symbol = "HGZ26.CMX"
          url = f"https://query1.finance.yahoo.com/v8/finance/chart/{symbol}"
          period1 = int(day_start.astimezone(pytz.UTC).timestamp())
          period2 = int(now.astimezone(pytz.UTC).timestamp()) + 60
          params = {"period1": period1, "period2": period2, "interval": "5m"}
          res = requests.get(url, headers=HEADERS, params=params, timeout=15)
          data = res.json()
          result = data["chart"]["result"][0]
          timestamps = result.get("timestamp")
          quote = result["indicators"]["quote"][0]

          bars = []
          for i, ts in enumerate(timestamps):
              if ts is None:
                  continue
              bt = datetime.fromtimestamp(ts, tz=pytz.UTC).astimezone(KST)
              h, l = quote["high"][i], quote["low"][i]
              bars.append((bt, h, l))

          print(f"오늘({today}) {symbol} day_start={day_start}, 총 {len(bars)}개 5분봉\n")

          for label, target_dt in checkpoints.items():
              highs = [h for bt, h, l in bars if day_start <= bt <= target_dt and h is not None]
              lows  = [l for bt, h, l in bars if day_start <= bt <= target_dt and l is not None]
              if not highs or not lows:
                  print(f"{label} ({target_dt.strftime('%H:%M')}) : 해당 구간 데이터 없음")
                  continue
              hi, lo = max(highs), min(lows)
              ticks = round((hi - lo) / 0.001)
              n_bars = len([bt for bt, h, l in bars if day_start <= bt <= target_dt])
              print(f"{label} ({target_dt.strftime('%H:%M')}) : 고={hi:.4f} 저={lo:.4f} 틱차이={ticks}  (누적 {n_bars}개봉 사용)")
          PYEOF
