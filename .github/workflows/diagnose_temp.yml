name: "임시 진단 - 아시아장중 변동 역추적"
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "패키지 설치"
        run: pip install requests pytz
      - name: "아시아장중 변동 시점 역추적"
        run: |
          python3 << 'PYEOF'
          import requests, pytz
          from datetime import datetime, timedelta

          KST = pytz.timezone("Asia/Seoul")
          HEADERS = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"}

          now = datetime.now(KST)
          today = now.date()
          day_start = KST.localize(datetime(today.year, today.month, today.day, 7, 0))
          window_end = KST.localize(datetime(today.year, today.month, today.day, 12, 0))

          symbols = {
              "나스닥": "MNQU26.CME",
              "오일": "CLV26.NYM",
              "골드": "GCZ26.CMX",
          }

          for name, symbol in symbols.items():
              print(f"\n===== {name} ({symbol}) : {day_start.strftime('%H:%M')} ~ {window_end.strftime('%H:%M')} =====")
              url = f"https://query1.finance.yahoo.com/v8/finance/chart/{symbol}"
              period1 = int(day_start.astimezone(pytz.UTC).timestamp())
              period2 = int(window_end.astimezone(pytz.UTC).timestamp()) + 60
              params = {"period1": period1, "period2": period2, "interval": "5m"}
              try:
                  res = requests.get(url, headers=HEADERS, params=params, timeout=15)
                  data = res.json()
                  result = data["chart"]["result"][0]
                  timestamps = result.get("timestamp")
                  if not timestamps:
                      print("  데이터 없음")
                      continue
                  quote = result["indicators"]["quote"][0]

                  running_high, running_low = None, None
                  high_time, low_time = None, None
                  rows = []
                  for i, ts in enumerate(timestamps):
                      if ts is None:
                          continue
                      bt = datetime.fromtimestamp(ts, tz=pytz.UTC).astimezone(KST)
                      h, l, v = quote["high"][i], quote["low"][i], quote.get("volume", [None]*len(timestamps))[i]
                      if h is not None and (running_high is None or h > running_high):
                          running_high = h
                          high_time = bt
                      if l is not None and (running_low is None or l < running_low):
                          running_low = l
                          low_time = bt
                      rows.append((bt, h, l, v))

                  print(f"  누적 고가={running_high} @ {high_time.strftime('%H:%M') if high_time else None}")
                  print(f"  누적 저가={running_low} @ {low_time.strftime('%H:%M') if low_time else None}")

                  # 고가/저가 갱신이 일어난 시점만 별도로 나열 (변동이 실제로 언제 몰렸는지)
                  print("  --- 고가/저가 갱신 이력 ---")
                  rh, rl = None, None
                  for bt, h, l, v in rows:
                      updated = []
                      if h is not None and (rh is None or h > rh):
                          rh = h
                          updated.append(f"신고가 {h}")
                      if l is not None and (rl is None or l < rl):
                          rl = l
                          updated.append(f"신저가 {l}")
                      if updated:
                          print(f"    {bt.strftime('%H:%M')} vol={v} : {', '.join(updated)}")
              except Exception as e:
                  print("  오류:", e)
          PYEOF
