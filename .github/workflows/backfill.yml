name: "수동 백필"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "백필 방식 (intraday: 특정 시각까지 누적 / daily: 하루 전체 마감)"
        required: true
        default: "intraday"
        type: choice
        options:
          - "intraday"
          - "daily"
      date:
        description: "조회할 날짜 (YYYY-MM-DD, 실제 조회 시각의 날짜 - 미장후는 다음날 날짜)"
        required: true
      time:
        description: "조회할 시각 (HH:MM, intraday 모드에서만 사용, daily 모드는 비워두세요)"
        required: false
      timing:
        description: "타이밍/라벨"
        required: true
        default: "asia_close"
        type: choice
        options:
          - "asia_close"
          - "europe_open"
          - "us_open"
          - "us_close"
          - "jobless_claims_before"
          - "jobless_claims_after"
          - "custom"
      timing_custom:
        description: "타이밍이 custom일 때 직접 입력 (예: CPI_전)"
        required: false
      dry_run:
        description: "미리보기만 (시트에 안 씀)"
        required: true
        default: true
        type: boolean

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "패키지 설치"
        run: pip install -r requirements-cloud.txt

      - name: "구글 인증 토큰 복원"
        run: echo "${{ secrets.GOOGLE_TOKEN_B64 }}" | base64 -d > token.pickle

      - name: "백필 실행"
        env:
          MODE: ${{ inputs.mode }}
          DATE: ${{ inputs.date }}
          TIME: ${{ inputs.time }}
          TIMING: ${{ inputs.timing }}
          TIMING_CUSTOM: ${{ inputs.timing_custom }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          case "$TIMING" in
            asia_close) FINAL_TIMING="아시아마감전" ;;
            europe_open) FINAL_TIMING="유럽개장전" ;;
            us_open) FINAL_TIMING="미장전" ;;
            us_close) FINAL_TIMING="미장후" ;;
            jobless_claims_before) FINAL_TIMING="신규실업수당_전" ;;
            jobless_claims_after) FINAL_TIMING="신규실업수당_후" ;;
            custom) FINAL_TIMING="$TIMING_CUSTOM" ;;
            *) FINAL_TIMING="$TIMING" ;;
          esac

          ARGS="$DATE"
          if [ "$MODE" = "intraday" ]; then
            ARGS="$ARGS $TIME $FINAL_TIMING"
          else
            ARGS="$ARGS $FINAL_TIMING"
          fi
          if [ "$DRY_RUN" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi

          echo "실행: python backfill_amplitude.py $ARGS"
          python backfill_amplitude.py $ARGS
