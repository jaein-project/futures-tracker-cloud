name: 경제발표 자동 체크

on:
  schedule:
    - cron: "*/5 * * * *"   # 5분마다 (GitHub Actions cron 최소 간격)
  workflow_dispatch:

jobs:
  check-economic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: pip install -r requirements-cloud.txt

      - name: 구글 인증 토큰 복원
        run: echo "${{ secrets.GOOGLE_TOKEN_B64 }}" | base64 -d > token.pickle

      - name: 경제발표 체크 & 필요시 기록
        run: python gh_actions_economic_check.py
