name: "진폭 스프레드시트 자동 백업"

# 2026-09-05 신설 - 재인님 요청 ("백업이 부족하다"는 피드백에 따라 이중 백업 체계 구성):
#   1) 구글 드라이브 "진폭_백업" 폴더에 스프레드시트 전체를 통째로 복사
#   2) 이 저장소의 backups/ 폴더에 xlsx 스냅샷을 커밋
# 두 백업 모두 backup_sheet.py 하나가 처리하고, 여기서는 그 실행 + 커밋/푸시만 담당.

on:
  schedule:
    # 2026-09-05 수정 (재인님 요청): 처음엔 UTC 17:00(한국시간 새벽 2시)로 잡았었는데,
    # 미장마감 + 그날의 진폭 Slack 알림이 전부 끝난 뒤에 백업하는 게 더 안전하다는 의견
    # 반영 - UTC 20:30(한국시간 새벽 5시 30분)으로 변경.
    - cron: "30 20 * * *"   # 매일 UTC 20:30 (한국시간 새벽 5시 30분)
  workflow_dispatch:

permissions:
  contents: write   # backups/ 폴더에 새 스냅샷을 커밋하기 위해 필요

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "패키지 설치"
        run: pip install -r requirements-cloud.txt

      - name: "구글 인증 토큰 복원"
        run: echo "${{ secrets.GOOGLE_TOKEN_B64 }}" | base64 -d > token.pickle

      - name: "백업 실행 (드라이브 복사 + xlsx 스냅샷 생성)"
        env:
          # 2026-09-05 수정: 백업 실패 알림 전용 채널(#system-notify)로 보내려면 그 채널에
          # 초대된 전용 봇(systembot)의 토큰이 필요해서 SLACK_BOT_TOKEN → SLACK_BOT_TOKEN_SYSTEM
          # 으로 교체 (alerts.py의 alert_backup_error가 이 토큰으로 systembot을 통해 전송함).
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_BOT_TOKEN_SYSTEM: ${{ secrets.SLACK_BOT_TOKEN_SYSTEM }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python backup_sheet.py

      - name: "스냅샷 커밋 & 푸시"
        id: commit_push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/
          if ! git diff --cached --quiet; then
            git commit -m "진폭 스프레드시트 자동 백업 $(date -u +%Y-%m-%d)"
            git push
          else
            echo "변경 사항 없음 (오늘 스냅샷이 이미 있음)"
          fi

      - name: "GitHub 저장 실패 알림"
        # 2026-09-05 신설: 위 "백업 실행" 스텝(구글 드라이브 백업 + xlsx 생성)은 이미 성공했는데
        # 이 커밋/푸시 스텝만 실패한 경우 전용으로, 심각도가 낮다는 걸 알려주는 별도 알림을 보냄
        # (steps.commit_push.conclusion == 'failure'로 정확히 "이 스텝"의 실패만 감지 - job
        # 전체의 failure()를 쓰면 다른 스텝 실패에도 오탐할 수 있어서 피함).
        if: steps.commit_push.conclusion == 'failure'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_BOT_TOKEN_SYSTEM: ${{ secrets.SLACK_BOT_TOKEN_SYSTEM }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -c "from alerts import alert_backup_github_push_failed; alert_backup_github_push_failed()"
