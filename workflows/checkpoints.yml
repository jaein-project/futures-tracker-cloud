name: 진폭 체크포인트

on:
  schedule:
    # 시각은 전부 UTC 기준 (KST = UTC+9, 한국은 서머타임 없음)
    - cron: "20 6 * * *"   # 15:20 KST - 아시아마감전
    - cron: "55 6 * * *"   # 15:55 KST - 유럽개장전
    - cron: "25 13 * * *"  # 22:25 KST - 미장전 (서머타임)
    - cron: "25 14 * * *"  # 23:25 KST - 미장전 (겨울시간)
    - cron: "5 20 * * *"   # 05:05 KST - 미장후 (서머타임)
    - cron: "5 21 * * *"   # 06:05 KST - 미장후 (겨울시간)
  workflow_dispatch:        # 수동 테스트 실행 버튼

jobs:
  run-checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: pip install -r requirements-cloud.txt

      - name: 구글 인증 토큰 복원
        run: echo "${{ secrets.GOOGLE_TOKEN_B64 }}" | base64 -d > token.pickle

      - name: 어느 체크포인트인지 판별해서 실행
        env:
          MATCHED_CRON: ${{ github.event.schedule }}
        run: |
          case "$MATCHED_CRON" in
            "20 6 * * *")  TIMING="아시아마감전" ;;
            "55 6 * * *")  TIMING="유럽개장전" ;;
            "25 13 * * *") TIMING="미장전" ;;
            "25 14 * * *") TIMING="미장전" ;;
            "5 20 * * *")  TIMING="미장후" ;;
            "5 21 * * *")  TIMING="미장후" ;;
            *) TIMING="아시아마감전" ;;  # workflow_dispatch로 수동 실행 시 기본값 (테스트용)
          esac
          echo "타이밍: $TIMING (트리거: $MATCHED_CRON)"
          python gh_actions_checkpoint.py "$TIMING"
